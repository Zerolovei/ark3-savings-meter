<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARK3 ステーション貯金メーター</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#35274d;background:#f5efff}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:18px}header{text-align:center;padding:22px 0}h1{font-size:24px;margin:5px}.muted{color:#7d708f;font-size:13px}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 14px #50387516}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.name{font-weight:700}.number{font-size:28px;font-weight:800}.buttons{display:flex;gap:8px}button{border:0;border-radius:11px;padding:10px 15px;font-size:16px;cursor:pointer}button:disabled{opacity:.45}.plus{background:#7753c8;color:white}.minus{background:#efe7fc;color:#6843b7}.danger{background:#ffe5e9;color:#a43850}.bar{background:#eee9f4;border-radius:20px;height:9px;margin-top:12px;overflow:hidden}.fill{background:linear-gradient(90deg,#bda5ff,#7652c9);height:100%;transition:width .2s}.negi{border:2px solid #b8dfb9}.negi .fill{background:#6ab96e}.hidden{display:none!important}input{width:100%;padding:12px;border:1px solid #dcd4e6;border-radius:10px;margin:6px 0;font-size:16px}#status{text-align:center;font-size:13px;overflow-wrap:anywhere}#authMessage{font-size:13px;overflow-wrap:anywhere;color:#9c3154}#loginArea h2{font-size:17px;margin:0 0 10px}

/* ARK3 金貨の貯金箱 背景（bac.png は index.html と同じフォルダ） */
html { min-height: 100%; background: #25113f; }
body {
  min-height: 100vh;
  background-image: linear-gradient(rgba(29, 12, 58, .42), rgba(29, 12, 58, .58)), url("./bac.png");
  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
header, header .muted, #status, main > .muted { color: #fff; text-shadow: 0 2px 7px rgba(0,0,0,.75); }
.card { background: rgba(255,255,255,.93); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); box-shadow: 0 5px 22px rgba(18,6,40,.24); }
@media (max-width: 700px) { body { background-attachment: scroll; background-position: center top; } }
</style></head><body><main><header><div>💜 ARK3 💜</div><h1>ステーション貯金メーター</h1><div class="muted">みんなで見守る貯金ストック</div></header><p id="status">接続中...</p><div id="stations"></div><section class="card negi"><div class="row"><strong>🌱 ネギ貯金</strong><div><span id="negiCount" class="number">0</span> 本</div></div><div class="bar"><div class="fill" id="negiBar" style="width:0%"></div></div><div id="negiControls" class="buttons hidden" style="justify-content:flex-end;margin-top:14px"><button id="addNegi" class="plus">＋1 🌱</button><button id="clearNegi" class="danger">クリア</button></div></section><section class="card"><div id="loginArea"><h2>🔐 管理者ログイン</h2><input id="email" type="email" autocomplete="username" placeholder="メールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード"><button id="login" class="plus">ログイン</button></div><div id="logoutArea" class="hidden row"><strong>🔓 管理者モード</strong><button id="logout">ログアウト</button></div><p id="authMessage" role="alert"></p></section><p class="muted" style="text-align:center">貯金はリアルタイムで共有されます</p></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyA57YhVF_w-jmBBFZxrRlLx50oo3dmzLQA',authDomain:'ark3-savings-meter.firebaseapp.com',projectId:'ark3-savings-meter',storageBucket:'ark3-savings-meter.firebasestorage.app',messagingSenderId:'253857552715',appId:'1:253857552715:web:f9742066082fcb08c030ce'};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),ref=doc(db,'savings','main');
const names=['五反田','南青山','麻布十番','新橋','三軒茶屋','自由が丘','千歳船橋','大森','北千束','塩浜'];
const initial={...Object.fromEntries(names.map(n=>[n,0])),negi:0};
let data={...initial},loggedIn=false,busy=false;
const $=id=>document.getElementById(id);
function render(){
 $('stations').replaceChildren();
 for(const name of names){const count=Number(data[name])||0;const card=document.createElement('section');card.className='card';const top=document.createElement('div');top.className='row';const title=document.createElement('span');title.className='name';title.textContent=name;const right=document.createElement('div');right.className='row';const num=document.createElement('span');num.className='number';num.textContent=count;right.append(num);
 if(loggedIn){const controls=document.createElement('div');controls.className='buttons';for(const [label,delta,cls] of [['−',-1,'minus'],['＋',1,'plus']]){const btn=document.createElement('button');btn.className=cls;btn.textContent=label;btn.disabled=busy;btn.onclick=()=>change(name,delta);controls.append(btn)}right.append(controls)}top.append(title,right);const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=Math.min(count*10,100)+'%';bar.append(fill);card.append(top,bar);$('stations').append(card)}
 $('negiCount').textContent=Math.max(0,Number(data.negi)||0);$('negiBar').style.width=Math.min(Math.max(0,Number(data.negi)||0)*10,100)+'%';$('negiControls').classList.toggle('hidden',!loggedIn);$('addNegi').disabled=busy;$('clearNegi').disabled=busy;
}
async function change(field,delta,clear=false){if(!loggedIn||busy)return;busy=true;render();try{await runTransaction(db,async tx=>{const snap=await tx.get(ref);const old=snap.exists()?Number(snap.data()[field]??0):0;const safe=Number.isFinite(old)?Math.floor(old):0;const next=clear?0:(field==='negi'?Math.max(0,safe+delta):safe+delta);tx.set(ref,{[field]:next},{merge:true})})}catch(e){alert('保存できませんでした: '+(e.code||e.message))}finally{busy=false;render()}}
$('addNegi').onclick=()=>change('negi',1);$('clearNegi').onclick=()=>{if(confirm('ネギ貯金をすべて0に戻しますか？'))change('negi',0,true)};
$('login').onclick=async()=>{const btn=$('login');btn.disabled=true;$('authMessage').textContent='ログイン中...';try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value='';$('authMessage').textContent=''}catch(e){$('authMessage').textContent='ログインエラー: '+(e.code||'unknown')+'（メール・パスワードやFirebase設定を確認してください）'}finally{btn.disabled=false}};
$('logout').onclick=async()=>{try{await signOut(auth)}catch(e){$('authMessage').textContent='ログアウトエラー: '+(e.code||'unknown')}};
onAuthStateChanged(auth,user=>{loggedIn=!!user;$('loginArea').classList.toggle('hidden',loggedIn);$('logoutArea').classList.toggle('hidden',!loggedIn);render()},e=>{$('authMessage').textContent='認証エラー: '+(e.code||e.message)});
onSnapshot(ref,snap=>{data={...initial,...(snap.exists()?snap.data():{})};$('status').textContent=snap.exists()?'🟢 リアルタイム接続中':'🟡 初期状態（管理者の最初の操作で保存）';render()},e=>{$('status').textContent='🔴 接続エラー: '+(e.code||e.message)});
render();
</script></body></html>
