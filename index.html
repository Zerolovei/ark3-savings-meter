
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARK3 ステーション貯金メーター</title>
<style>
:root {
  --purple:#7554c8;
  --light:#eee7ff;
  --ink:#34294d;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:system-ui,sans-serif;
  background:linear-gradient(160deg,#eee7ff,#fff8fd);
  color:var(--ink);
}
main {max-width:680px;margin:auto;padding:18px}
header {text-align:center;padding:20px 0}
h1 {font-size:25px;margin:5px}
.subtitle {color:#827594;font-size:13px}
.card {
  background:white;
  border-radius:18px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 4px 16px #60458a16;
}
.row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.name {font-weight:700}
.count {font-size:27px;font-weight:800}
.controls {display:flex;gap:8px}
button {
  border:0;
  border-radius:12px;
  padding:10px 15px;
  font-size:16px;
  cursor:pointer;
}
.plus {background:var(--purple);color:white}
.minus {background:#f1eafb;color:#6542b4}
.clear {background:#ffe4e8;color:#a33c55}
.bar {
  height:10px;
  background:#eee9f5;
  border-radius:20px;
  margin-top:12px;
  overflow:hidden;
}
.fill {
  height:100%;
  background:linear-gradient(90deg,#b9a0ff,#7554c8);
  border-radius:20px;
  transition:width .3s;
}
.negi .fill {background:#73bf74}
.negi {border:2px solid #c9e8c8}
.hidden {display:none!important}
input {
  width:100%;
  padding:12px;
  margin:5px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
#status {text-align:center;font-size:13px}
.admin {background:#f5efff}
.small {font-size:12px;color:#827594}
button:disabled {opacity:.4;cursor:not-allowed}
</style>
</head>
<body>
<main>
<header>
  <div>💜 ARK3 💜</div>
  <h1>ステーション貯金メーター</h1>
  <div class="subtitle">みんなで見守る貯金ストック</div>
</header>

<p id="status">接続中...</p>

<div id="stations"></div>

<section class="card negi">
  <div class="row">
    <div class="name">🌱 ネギ貯金</div>
    <div><span id="negiCount" class="count">0</span> 本</div>
  </div>
  <div class="bar">
    <div id="negiBar" class="fill" style="width:0%"></div>
  </div>
  <div id="negiControls" class="controls hidden"
       style="justify-content:flex-end;margin-top:12px">
    <button class="plus" id="addNegi">＋1 🌱</button>
    <button class="clear" id="clearNegi">クリア</button>
  </div>
</section>

<section class="card admin">
  <div id="loginArea">
    <h3>🔐 管理者ログイン</h3>
    <input id="email" type="email"
           placeholder="メールアドレス" autocomplete="username">
    <input id="password" type="password"
           placeholder="パスワード"
           autocomplete="current-password">
    <button class="plus" id="login">ログイン</button>
  </div>
  <div id="logoutArea" class="hidden">
    <div class="row">
      <strong>🔓 管理者モード</strong>
      <button id="logout">ログアウト</button>
    </div>
  </div>
  <p id="authMessage" class="small"></p>
</section>

<p class="small" style="text-align:center">
  データはリアルタイムで更新されます。
</p>
</main>

<script type="module">
import {initializeApp}
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getFirestore,doc,onSnapshot,runTransaction
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import {
  getAuth,onAuthStateChanged,
  signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyA57YhVF_w-jmBBFZxrRLx50oo3dmzLQA",
  authDomain:"ark3-savings-meter.firebaseapp.com",
  projectId:"ark3-savings-meter",
  storageBucket:"ark3-savings-meter.firebasestorage.app",
  messagingSenderId:"253857552715",
  appId:"1:253857552715:web:f9742066082fcb08c030ce"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);
const dataRef=doc(db,"savings","main");

const names=[
  "五反田","南青山","麻布十番","新橋",
  "三軒茶屋","自由が丘","千歳船橋",
  "大森","北千束","塩浜"
];

const initial={
  ...Object.fromEntries(names.map(n=>[n,0])),
  negi:0
};

let data={...initial};
let admin=false;
let busy=false;
let connected=false;

const $=id=>document.getElementById(id);

function render(){
  $("stations").innerHTML=names.map(name=>{
    const n=data[name]??0;
    const width=Math.min(n*10,100);
    return `
    <section class="card">
      <div class="row">
        <span class="name">${name}</span>
        <div class="row">
          <span class="count">${n}</span>
          ${admin?`
          <div class="controls">
            <button class="minus" data-name="${name}"
              data-delta="-1" ${busy?"disabled":""}>−</button>
            <button class="plus" data-name="${name}"
              data-delta="1" ${busy?"disabled":""}>＋</button>
          </div>`:""}
        </div>
      </div>
      <div class="bar">
        <div class="fill" style="width:${width}%"></div>
      </div>
    </section>`;
  }).join("");

  $("negiCount").textContent=data.negi??0;
  $("negiBar").style.width=
    Math.min((data.negi??0)*10,100)+"%";
  $("negiControls").classList.toggle("hidden",!admin);
  $("addNegi").disabled=busy;
  $("clearNegi").disabled=busy;
}

async function change(field,delta,reset=false){
  if(!admin||busy)return;
  busy=true;
  render();
  try{
    await runTransaction(db,async tx=>{
      const snap=await tx.get(dataRef);
      const current=snap.exists()?snap.data():{};
      const old=Number(current[field]??0);
      const safe=Number.isFinite(old)?
        Math.max(0,Math.floor(old)):0;
      const next=reset?0:Math.max(0,safe+delta);
      tx.set(dataRef,{[field]:next},{merge:true});
    });
  }catch(e){
    alert("保存できませんでした: "+e.message);
  }finally{
    busy=false;
    render();
  }
}

$("stations").addEventListener("click",e=>{
  const btn=e.target.closest("button[data-name]");
  if(!btn)return;
  change(btn.dataset.name,Number(btn.dataset.delta));
});

$("addNegi").onclick=()=>change("negi",1);

$("clearNegi").onclick=()=>{
  if(confirm("ネギ貯金をすべて0に戻しますか？")){
    change("negi",0,true);
  }
};

$("login").onclick=async()=>{
  $("authMessage").textContent="ログイン中...";
  try{
    await signInWithEmailAndPassword(
      auth,$("email").value,$("password").value
    );
    $("password").value="";
    $("authMessage").textContent="";
  }catch(e){
    $("authMessage").textContent=
      "ログインできませんでした。入力内容を確認してください。";
  }
};

$("logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  admin=!!user;
  $("loginArea").classList.toggle("hidden",admin);
  $("logoutArea").classList.toggle("hidden",!admin);
  render();
});

onSnapshot(dataRef,snap=>{
  connected=true;
  data={...initial,...(snap.exists()?snap.data():{})};
  $("status").textContent=
    snap.exists()?"🟢 リアルタイム接続中":
    "🟡 初期状態（管理者の初回操作で保存）";
  render();
},error=>{
  connected=false;
  $("status").textContent="🔴 接続エラー: "+error.message;
});

render();
</script>
</body>
</html>
